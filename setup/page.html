<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{--bg:#eef1ec;--panel:#f8faf6;--ink:#1d2a24;--muted:#5d6b63;--line:#d3dbd3;--accent:#8a4b1f;--accent-ink:#fff;--good:#23704a;--bad:#a23a2c;--cell:#f1f4ef}
@media (prefers-color-scheme:dark){:root{--bg:#141b18;--panel:#1b2420;--ink:#e4ebe5;--muted:#9aa89f;--line:#2e3a34;--accent:#e0965c;--accent-ink:#1b120a;--good:#6fd39b;--bad:#f08a7a;--cell:#202a26;color-scheme:dark}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",system-ui,sans-serif;font-size:14px;display:flex;flex-direction:column;padding:24px 28px;gap:16px;user-select:none}
.head{display:flex;gap:16px;align-items:center}.head .grow{flex:1;min-width:0}
select{font:inherit;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:5px 8px}.head img{width:72px;height:72px}
h1{font-family:Georgia,"Times New Roman",serif;font-size:26px;margin:0;font-weight:700}
.sub{color:var(--muted);font-size:13px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px}
.path{font-family:Consolas,monospace;font-size:12px;background:var(--cell);border:1px solid var(--line);border-radius:6px;padding:6px 8px;word-break:break-all;user-select:text}
label{display:flex;gap:8px;align-items:center;cursor:pointer}input{width:16px;height:16px;margin:0}
ul{margin:0;padding-left:18px;color:var(--muted);font-size:13px;line-height:1.6}
.foot{margin-top:auto;display:flex;justify-content:flex-end;gap:8px;align-items:center}
.msg{margin-right:auto;font-size:13px}.msg.err{color:var(--bad)}.msg.ok{color:var(--good)}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 18px}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.bar{height:6px;border-radius:3px;background:var(--cell);overflow:hidden}.bar i{display:block;height:100%;width:30%;background:var(--accent);animation:mv 1s ease-in-out infinite alternate}
@keyframes mv{from{margin-left:0}to{margin-left:70%}}
</style></head><body>

function paint(){
  T=L[lang]; document.documentElement.lang=lang;
  $("#t").textContent=T.t; $("#v").textContent=T.v+info.version; $("#whereL").textContent=T.where; $("#dir").textContent=info.dir;
  $("#deskL").textContent=T.desk; $("#runL").textContent=T.run; $("#what").innerHTML=T.what.map(x=>"<li>"+x+"</li>").join("");
  if(!$("#go").dataset.done){ $("#go").textContent=info.update?T.update:T.install; $("#cancel").textContent=T.cancel; }
}
$("#lang").onchange=e=>{ lang=e.target.value; setupSetLang(lang); paint(); };
$("#cancel").onclick=()=>setupClose();
$("#go").onclick=async()=>{
  if($("#go").dataset.done){ setupLaunch(); return; }
  $("#go").disabled=true; $("#cancel").disabled=true; $("#bar").hidden=false; $("#msg").className="msg"; $("#msg").textContent=T.working;
  const run=$("#run").checked;
  $("#lang").disabled=true;
  await setupInstall({desktop:$("#desk").checked, launch:run, lang});
  const poll=setInterval(async()=>{
    const s=await setupStatus(); if(s.state==="working") return;
    clearInterval(poll); $("#bar").hidden=true; $("#cancel").disabled=false;
    if(s.state==="error"){ $("#msg").className="msg err"; $("#msg").textContent=T.err+s.msg; $("#go").disabled=false; return; }
    if(run){ setupClose(); return; }
    $("#msg").className="msg ok"; $("#msg").textContent=(info.update?T.doneUpd:T.done)+(s.msg?" "+s.msg:"");
    $("#cancel").textContent=T.close; $("#go").textContent=T.launch; $("#go").dataset.done="1"; $("#go").disabled=false; $("#opts").style.opacity=.6;
  },250);
};
init();
</script></body></html>
