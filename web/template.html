<title>Котёл алхимика</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+SC:wght@500;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: crafter's workbench. Tabs (potions / refining) on top. Row 1: item picker | recipe sheet. Row 2: craft plan | shopping list, one cell per city. */
:root{
  --bg:#eef1ec; --panel:#f8faf6; --ink:#1d2a24; --muted:#5d6b63; --line:#d3dbd3;
  --accent:#8a4b1f; --accent-ink:#ffffff; --accent-soft:#f1e2d4;
  --good:#23704a; --good-soft:#dcefe3; --bad:#a23a2c; --bad-soft:#f6e0dc; --warn:#8a6a12;
  --chip:#e3e9e2; --cell:#f1f4ef;
  --f-display:"Alegreya SC",Georgia,"Times New Roman",serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --t2:#8b8f86; --t3:#5c9a5a; --t4:#4d79c7; --t5:#c0473a; --t6:#d48a2e; --t7:#c9ad2b; --t8:#9aa3a8;
  --e1:#3f9a5a; --e2:#3f73c4; --e3:#8a52c4; --e4:#c9a227;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#141b18; --panel:#1b2420; --ink:#e4ebe5; --muted:#9aa89f; --line:#2e3a34;
  --accent:#e0965c; --accent-ink:#1b120a; --accent-soft:#3a2a1d;
  --good:#6fd39b; --good-soft:#1d3427; --bad:#f08a7a; --bad-soft:#3a201c; --warn:#e2c15a;
  --chip:#26312c; --cell:#202a26; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141b18; --panel:#1b2420; --ink:#e4ebe5; --muted:#9aa89f; --line:#2e3a34;
  --accent:#e0965c; --accent-ink:#1b120a; --accent-soft:#3a2a1d;
  --good:#6fd39b; --good-soft:#1d3427; --bad:#f08a7a; --bad-soft:#3a201c; --warn:#e2c15a;
  --chip:#26312c; --cell:#202a26; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
.wrap{max-width:1360px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:18px 40px;display:flex;flex-direction:column;gap:14px}
header.top{display:flex;flex-wrap:wrap;align-items:flex-end;gap:12px 24px;justify-content:space-between}
h1{font-family:var(--f-display);font-weight:700;font-size:30px;margin:0;letter-spacing:.01em;text-wrap:balance}
h2{font-family:var(--f-display);font-weight:700;font-size:20px;margin:0;text-wrap:balance}
h3{font-family:var(--f-display);font-weight:500;font-size:16px;margin:0}
.sub{color:var(--muted);font-size:13px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.controls{display:flex;flex-wrap:wrap;gap:8px;align-items:flex-end}
.ctl select{min-width:130px}
.ctl{display:flex;flex-direction:column;gap:3px;font-size:11px;color:var(--muted);min-width:0}
select,input[type=number],input[type=search]{font:inherit;font-size:14px;color:var(--ink);background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:6px 8px;min-width:0;max-width:100%}
input[type=number]{font-family:var(--f-mono);width:100%}
button{font:inherit;cursor:pointer;border-radius:6px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:7px 12px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600}
button:disabled{opacity:.45;cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px;min-width:0}
.panel-head{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line)}
.tab{border:1px solid transparent;border-bottom:0;border-radius:8px 8px 0 0;background:transparent;padding:9px 18px;font-family:var(--f-display);font-size:17px;color:var(--muted);margin-bottom:-1px}
.tab[aria-selected="true"]{background:var(--panel);border-color:var(--line);color:var(--ink)}
.row1{display:grid;grid-template-columns:290px minmax(0,1fr);gap:16px;align-items:start}
.row2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:start}
@media (max-width:980px){.row2{grid-template-columns:minmax(0,1fr)}}
@media (max-width:760px){.row1{grid-template-columns:minmax(0,1fr)}}
.status{font-size:13px;padding:8px 12px;border-radius:8px;background:var(--cell)}
.status.err{color:var(--bad);background:var(--bad-soft)}
/* picker */
.shelf{display:flex;flex-direction:column;gap:10px;max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:12px}
@media (max-width:760px){.shelf{max-height:380px;position:static}}
.fam-name{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:4px 2px}
.fam-row{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.pot{display:flex;align-items:center;justify-content:center;gap:4px;padding:3px;border-radius:8px;border:1px solid transparent;background:var(--chip);color:var(--ink)}
.pot img,.ico{width:34px;height:34px}
.pot[aria-pressed="true"],.rfam[aria-pressed="true"],.seg button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.rfam{display:grid;grid-template-columns:40px minmax(0,1fr);gap:8px;align-items:center;text-align:left;padding:6px 8px;border-radius:8px;border:1px solid transparent;background:var(--chip);color:var(--ink);width:100%}
.rfam img{width:40px;height:40px}
.rfam .alt{display:block}
.glist{display:flex;flex-direction:column;gap:6px}
.glist .rfam b{font-weight:500}
#gBranch{width:100%}
.gcity{font-size:12px;color:var(--muted);padding:0 2px}
.seg{display:grid;gap:4px}
.seg.t{grid-template-columns:repeat(7,minmax(0,1fr))}
.seg.e{grid-template-columns:repeat(5,minmax(0,1fr))}
.seg.p{grid-template-columns:repeat(4,minmax(0,1fr))}
.seg.r{grid-template-columns:repeat(2,minmax(0,1fr))}
.buybar{display:flex;flex-wrap:wrap;align-items:center;gap:8px 12px;margin:0 0 8px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--cell)}
.buybar .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.buyseg{min-width:280px}
.buyhint{flex-basis:100%}
.cmp-pill{font-family:var(--f-mono);font-size:13px;padding:4px 10px;border-radius:999px;white-space:nowrap}
.cmp-pill.good{background:var(--good-soft);color:var(--good)}
.cmp-pill.bad{background:var(--bad-soft);color:var(--bad)}
@media (max-width:520px){.buyseg{min-width:0;flex:1}}
.seg.r button{font-family:var(--f-body);font-size:13px;padding:6px 4px}
.seg button{padding:6px 0;font-family:var(--f-mono);font-size:13px;background:var(--chip);border-color:transparent}
.tier{font-family:var(--f-mono);font-size:11px;font-weight:500;padding:1px 5px;border-radius:4px;color:#fff;background:var(--t4);white-space:nowrap}
.tier.t2{background:var(--t2)}.tier.t3{background:var(--t3)}.tier.t4{background:var(--t4)}.tier.t5{background:var(--t5)}.tier.t6{background:var(--t6)}.tier.t7{background:var(--t7);color:#2a2306}.tier.t8{background:var(--t8);color:#1a1d1f}
.ench{font-family:var(--f-mono);font-size:11px;padding:1px 5px;border-radius:4px;color:#fff}
.ench.e1{background:var(--e1)}.ench.e2{background:var(--e2)}.ench.e3{background:var(--e3)}.ench.e4{background:var(--e4);color:#231c04}
/* recipe */
.recipe-head{display:grid;grid-template-columns:72px minmax(0,1fr) auto;gap:14px;align-items:center}
@media (max-width:520px){.recipe-head{grid-template-columns:56px minmax(0,1fr)}.recipe-head button{grid-column:1/-1}}
.recipe-head img{width:72px;height:72px;max-width:100%}
.alt{color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.cells{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:14px 0}
.cell{background:var(--cell);border:1px solid var(--line);border-radius:8px;padding:8px 10px;display:flex;flex-direction:column;gap:4px;min-width:0}
.cell .k{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.cell .v{font-family:var(--f-mono);font-size:18px;font-weight:500;overflow-wrap:anywhere}
.cell.chk{flex-direction:row;align-items:center;gap:8px;font-size:14px;cursor:pointer}
.cell.chk input{width:18px;height:18px;margin:0;flex:none}
.cell.chk small{display:block;color:var(--muted);font-size:11px}
.cell.profit.pos{background:var(--good-soft);border-color:transparent}.cell.profit.pos .v{color:var(--good)}
.cell.profit.neg{background:var(--bad-soft);border-color:transparent}.cell.profit.neg .v{color:var(--bad)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:8px}
table{width:100%;border-collapse:collapse}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:500;text-align:left;padding:7px 8px;background:var(--cell);border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
tbody tr:last-child td{border-bottom:0}
th+th,td+td{border-left:1px solid var(--line)}
td.n,th.n{text-align:right;white-space:nowrap;font-family:var(--f-mono);font-variant-numeric:tabular-nums}
th.n{font-family:var(--f-body)}
tr.made td{background:var(--cell)}
.ing{display:flex;gap:8px;align-items:center;min-width:170px}
.ing img{width:32px;height:32px;flex:none}
.ing .nm{font-weight:500}
td select{width:100%;min-width:130px}
td input.price{width:100px;text-align:right}
.edited{border-color:var(--warn)!important}
.sell{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin-top:14px}
.cities{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:10px}
.city-cell{padding:8px 10px;border-radius:8px;background:var(--cell);border:1px solid var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.cc-top{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:2px 6px;min-height:20px}
.cc-name{font-size:13px;font-weight:500;white-space:nowrap}
.cc-tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em;color:var(--good);background:var(--good-soft);padding:1px 6px;border-radius:999px;white-space:nowrap}
.cc-price{font-size:17px;font-weight:500}
.th-sub{display:block;font-size:10px;font-weight:400;text-transform:none;letter-spacing:0;opacity:.75}
.cc-net{font-size:11px}
.cc-last{font-size:11px;opacity:.8}
.city-cell.none .cc-price{color:var(--muted)}
.city-cell.best{border-color:var(--good)}
.tag{font-size:10px;text-transform:uppercase;letter-spacing:.05em}.tag.best{color:var(--good)}.tag.low{color:var(--accent)}
.subhead{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:14px 0 6px}
/* plan */
.plan-list{display:flex;flex-direction:column;gap:6px}
.plan-item{display:grid;grid-template-columns:32px minmax(0,1fr) auto;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:8px;background:var(--cell)}
.plan-item img{width:32px;height:32px}
.plan-item .x{padding:2px 9px}
.plan-sum{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (max-width:640px){.plan-sum{grid-template-columns:minmax(0,1fr)}}
.plan-tbl input.pq{width:84px;text-align:right}
.plan-tbl select{min-width:120px}
.plan-tbl td.pos{color:var(--good)} .plan-tbl td.neg{color:var(--bad)}
.plan-tbl tfoot td{font-weight:600;background:var(--cell);border-top:1px solid var(--line)}
.plan-tbl .x{padding:2px 9px}
/* shopping */
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(360px,1fr));gap:10px}
@media (max-width:520px){.shop-grid{grid-template-columns:minmax(0,1fr)}}
.shop-city{border:1px solid var(--line);border-radius:8px;overflow:hidden;min-width:0}
.shop-city h3{display:flex;justify-content:space-between;align-items:baseline;gap:8px;padding:8px 10px;background:var(--cell);border-bottom:1px solid var(--line)}
.shop-city .tbl{border:0;border-radius:0}
.shop-city table{font-size:13px}
.shop-city td,.shop-city th{padding:6px 6px}
.shop-city th{font-size:10px;background:transparent}
.shop-item{display:flex;align-items:center;gap:6px;min-width:90px}
.shop-city th{letter-spacing:.02em}
.shop-item img{width:22px;height:22px;flex:none}
.note{font-size:12px;color:var(--muted);margin:0;max-width:90ch}
.empty{color:var(--muted);font-size:13px;padding:8px 0}
#tour{position:fixed;inset:0;z-index:50}
.tour-spot{position:fixed;border-radius:10px;box-shadow:0 0 0 9999px rgba(10,16,13,.62);outline:2px solid var(--accent);transition:all .25s ease;pointer-events:none}
.tour-spot.center{left:50%;top:40%;width:0;height:0;outline:0}
.tour-card{position:fixed;width:min(380px,calc(100vw - 32px));background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:16px 18px;box-shadow:0 12px 40px rgba(0,0,0,.3);display:flex;flex-direction:column;gap:8px;transition:top .25s ease,left .25s ease}
.tour-card h3{font-size:19px}
.tour-card p{margin:0;line-height:1.5}
.tour-step{font-size:11px;color:var(--muted)}
.tour-btns{display:flex;gap:8px;align-items:center;margin-top:6px}
#tourSkip{border-color:transparent;background:transparent;color:var(--muted);padding-inline:4px}
@media (prefers-reduced-motion:reduce){.tour-spot,.tour-card{transition:none}}
#results{grid-template-columns:repeat(3,minmax(0,1fr))}
@media (max-width:640px){#results{grid-template-columns:repeat(2,minmax(0,1fr))}}
.groups{display:grid;grid-template-columns:minmax(0,2fr) minmax(0,1fr);gap:12px;margin:14px 0}
@media (max-width:1100px){.groups{grid-template-columns:minmax(0,1fr)}}
.group{border:1px dashed var(--line);border-radius:10px;padding:8px;min-width:0}
.group .cells{margin:0}
.group-name{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:2px 4px 8px}
.cell small.alt{font-size:11px}
.shop-tools{display:flex;justify-content:flex-end;margin-bottom:8px}
.shop-tools button{font-size:12px;padding:4px 10px}
th.have-h,td.have-c{text-align:center;width:1%;white-space:nowrap}
tr.is-have td{opacity:.5}
tr.is-have td.have-c{opacity:1}
tr.is-have .shop-item span{text-decoration:line-through}
.sw{position:relative;display:inline-block;width:34px;height:20px;cursor:pointer}
.sw input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}
.sw span{position:absolute;inset:0;border-radius:999px;background:var(--line);transition:background .15s}
.sw span::after{content:"";position:absolute;top:3px;left:3px;width:14px;height:14px;border-radius:50%;background:var(--panel);transition:transform .15s}
.sw input:checked+span{background:var(--good)}
.sw input:checked+span::after{transform:translateX(14px)}
.sw input:focus-visible+span{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){.sw span,.sw span::after{transition:none}}
.ctl-chk{display:flex;align-items:center;gap:6px;font-size:13px;color:var(--muted);padding:8px 2px;cursor:pointer}
.ctl-chk input{margin:0;width:16px;height:16px}
.update{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px 16px;align-items:center;padding:12px 14px;border-radius:10px;background:var(--accent-soft);border:1px solid var(--accent)}
.update-main{display:flex;flex-direction:column;gap:2px;min-width:0}
.update details{grid-column:1/-1;font-size:13px}
.upd-prog{grid-column:1/-1;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center}
.upd-bar{height:8px;border-radius:4px;background:var(--panel);overflow:hidden;border:1px solid var(--line)}
.upd-bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .2s}
@media (prefers-reduced-motion:reduce){.upd-bar i{transition:none}}
.update summary{cursor:pointer;color:var(--muted)}
.upd-notes{white-space:pre-wrap;margin-top:6px;max-height:200px;overflow:auto;font-size:13px}
.update-btns{display:flex;gap:8px;grid-row:1;grid-column:2}
@media (max-width:600px){.update{grid-template-columns:minmax(0,1fr)}.update-btns{grid-row:auto;grid-column:auto}}
.icon-btn{display:inline-flex;align-items:center;gap:6px}
dialog#settingsDlg{border:1px solid var(--line);border-radius:14px;padding:0;width:min(560px,calc(100vw - 32px));max-height:calc(100vh - 48px);background:var(--panel);color:var(--ink);box-shadow:0 20px 60px rgba(0,0,0,.35)}
dialog#settingsDlg::backdrop{background:rgba(10,16,13,.55)}
.set-head{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel)}
.set-head .icon-btn{font-size:20px;line-height:1;padding:4px 10px}
.set-body{padding:6px 18px 18px;display:flex;flex-direction:column;gap:14px;overflow:auto}
.set-sec{display:flex;flex-direction:column;gap:8px;padding-top:10px;border-top:1px solid var(--line)}
.set-sec:first-child{border-top:0}
.set-row{display:flex;justify-content:space-between;align-items:center;gap:12px;min-height:34px}
.set-row select{min-width:170px}
.set-chk{width:18px;height:18px;margin:0}
.seg.th{grid-template-columns:repeat(3,minmax(0,1fr));min-width:270px}
.seg.th button{font-family:var(--f-body);font-size:13px;padding:6px 8px}
.seg.th button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft)}
.reset-box{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:flex-end}
button.danger{background:var(--bad);border-color:var(--bad);color:#fff}
#ghLink{color:var(--accent)}
@media (max-width:520px){.set-row{flex-direction:column;align-items:stretch}.seg.th{min-width:0}}
textarea#copyArea{width:100%;height:160px;margin-top:8px;font-family:var(--f-mono);font-size:12px}
</style>

<div class="wrap">
  <header class="top">
    <div>
      <h1 id="title">Котёл алхимика</h1>
      <div class="sub" id="dataInfo"></div>
    </div>
    <div class="controls" id="topControls">
      <label class="ctl" for="priceMode"><span data-t="price"></span><select id="priceMode"><option value="avg" data-t="avg"></option><option value="now" data-t="now"></option></select></label>
      <button class="primary" id="refresh" data-t="refresh"></button>
      <button id="openSettings" class="icon-btn"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h0a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg><span data-t="settings"></span></button>
    </div>
  </header>
  <div class="status" id="status" hidden></div>
  <div class="update" id="updateBar" hidden role="status">

// Prices. With the 7-day average both sides use the average. With current prices:
// buying through a buy order pays the highest buy order (b), buying from the market pays the lowest sell price (s);
// selling through a sell order gets the lowest sell price (s), selling instantly gets the highest buy order (b).
function cityPrice(id, city, side="buy"){ const e = PRICES[id]?.[city]; if(!e) return 0;
  const p = st.priceMode!=="now" ? (e.a||e.s||0) : (e.s||0);
  return p || (side==="sell" ? e.l||0 : 0); } // a city with no orders right now: judge the sale by its last deal
// Last recorded deal in a city: price and how many days ago.
function lastSale(id, city){ const e=PRICES[id]?.[city]; if(!e?.l) return null;
  const d = e.lt ? Math.max(0, Math.floor((Date.now()-new Date(e.lt.slice(0,10)+"T00:00:00Z"))/864e5)) : null; return {p:e.l, d}; }
const daysAgo = d => d==null ? "" : d===0 ? T("today") : d+" "+T("dShort");
// Estimated market price: average deal price over all cities for 7 days, weighted by how much each city sold;
// if nothing sold this week, the newest last deal.
function marketValue(id){
  let sum=0, cnt=0, last=null;
  for(const c of CITIES){ const e=PRICES[id]?.[c]; if(!e) continue;
    if(e.a){ const w=Math.max(1,e.v||0); sum+=e.a*w; cnt+=w; }
    if(e.l && (!last || (e.lt||"")>(last.lt||""))) last={p:e.l, lt:e.lt||""}; }
  if(cnt) return {p:sum/cnt, how:"avg"};
  if(last) return {p:last.p, how:"last"};
  return null;
}
// Cheapest city with a real market: prefer cities that trade 50+ a day, so one stray order (often in Caerleon) does not win.
function cheapest(id){
  const pick = minVol => { let b=null; for(const c of CITIES){ const p=cityPrice(id,c), v=PRICES[id]?.[c]?.v; if(p>0 && (minVol===0 || (v!=null && v>=minVol)) && (!b||p<b.p)) b={c,p}; } return b; };
  return pick(50) || pick(0);
}

// by default the highest buy order in that city; buying through orders adds the 2.5% order fee.
function marketPrice(id){ return st.over[id]!=null ? st.over[id] : cityPrice(id, buyCity(id)); }
function topOrder(id){ return PRICES[id]?.[buyCity(id)]?.b || 0; }

// Sales tax 4% with premium or 8% without; placing an order (sell or buy) costs 2.5% more.
const SETUP = 0.025;
const taxRate = () => (st.premium?0.04:0.08);
const feeRate = () => taxRate() + SETUP; // selling always through a sell order
const buyFeeRate = () => st.buyVia==="order" ? SETUP : 0;
const pctStr = x => (x*100).toFixed(1).replace(/\.0$/,"").replace(".", st.lang==="ru"?",":".") + "%";
const feePct = () => pctStr(feeRate());
const cfg = id => isPotion(id) ? st.potion : isGear(id) ? st.gear : st.refine;
// Production bonus: base 18%, crafting bonus city +15%, refining bonus city +40%, focus +59%.
// Daily bonus adds +10% or +20% production bonus to the categories the game highlights that day.
function rrrFor(id){ const c=cfg(id), k=kindOf(id), city=k==="potion"?0.15:k==="gear"?(gCity(id)?0.15:0):0.40;
  return 1 - 1/(1.18 + (c.cityBonus?city:0) + (c.focus?0.59:0) + (+c.daily||0)); }

// How much to buy so that `crafts` crafts really come out. Returned resources arrive only after a batch and are
// rounded down, so the returns are crafted again in further rounds; the plan adds whatever the last round lacks.
// Rare alchemy ingredients (horns, claws, roots…) are never returned: they are bought for every craft.
function planBuy(ing, crafts, rrr, noReturn=[]){
  const ids=Object.keys(ing), back=i=>noReturn.includes(i)?0:rrr;
  const buy=Object.fromEntries(ids.map(i=>[i, Math.ceil(ing[i]*crafts*(1-back(i)))]));
  let rounds=[];
  for(let guard=0; guard<5000; guard++){
    const have={...buy}; let total=0; rounds=[];
    while(total<crafts){
      const c=Math.min(crafts-total, ...ids.map(i=>Math.floor(have[i]/ing[i])));
      if(c<=0) break;
      rounds.push(c); total+=c;
      for(const i of ids) have[i] += Math.floor(c*ing[i]*back(i)) - c*ing[i];
    }
    if(total>=crafts) break;
    for(const i of ids) if(have[i] < ing[i]) buy[i] += ing[i]-have[i];
  }
  return {buy, rounds};
}
const pct = x => (x*100).toFixed(1).replace(".", st.lang==="ru"?",":".") + "%";

// Recursive cost: buys raw materials, and (when chain is on) makes the previous-tier refined item itself.
function calc(id, qty, chain){
  const r = DATA.recipes[id], rrr = rrrFor(id);
  const crafts = Math.max(1, Math.ceil(qty / r.n)), made = crafts * r.n;
  const lines=[], madeLines=[]; let focus = (r.focus||0)*crafts;
  // "plain" mode buys the full recipe for every craft; returned resources stay with you as extra materials.
  const plain = !!cfg(id).plain, nr = r.nr||[];
  const pb = plain ? {buy:Object.fromEntries(Object.entries(r.ing).map(([i,q])=>[i,q*crafts])), rounds:[crafts]} : planBuy(r.ing, crafts, rrr, nr);
  let back = 0;
  for(const [iid,q] of Object.entries(r.ing)){
    const need = pb.buy[iid];
    if(plain && !nr.includes(iid)) back += Math.floor(q*crafts*rrr)*unitPrice(iid);
    if(chain && !isPotion(id) && DATA.recipes[iid]){
      const sub = calc(iid, need, chain);
      madeLines.push({iid, need, per:q, cost:sub.cost}, ...sub.madeLines);
      for(const l of sub.lines) lines.push(l);
      focus += sub.focus; back += sub.back;
    } else {
      const p=unitPrice(iid); lines.push({iid, per:q, need, gross:q*crafts, city:buyCity(iid), p, sum:need*p, missing:!p});
    }
  }
  // merge duplicate bought materials (chains can ask for the same item twice)
  const merged={}; for(const l of lines){ const m=merged[l.iid]; if(m){ m.need+=l.need; m.gross+=l.gross; m.sum+=l.sum; } else merged[l.iid]={...l}; }
  const out=Object.values(merged), cost=out.reduce((a,l)=>a+l.sum,0);
  const station=(st.station[id]||0)*crafts;
  const buyFee = cost*buyFeeRate();
  return {crafts, made, rounds:pb.rounds, lines:out, madeLines, cost, buyFee, station, back, perUnit:(cost+buyFee+station-back)/made, focus, missing:out.some(l=>l.missing)};
}

function renderShelf(){
  const q = searchQ.trim().toLowerCase(); const fams = {};
  for(const id of Object.keys(DATA.recipes)){
    if(!isPotion(id) || enchOf(id)) continue;

    const hay = [DATA.items[id]?.ru, DATA.items[id]?.en, FAM.ru[f], FAM.en[f]].join(" ").toLowerCase();
    if(q && !hay.includes(q)) continue;

  }

let shopText = "";
const curPlan = () => (st.plans[st.tab] ||= []);
function renderPlan(){
  const plan=curPlan(), pot=st.tab!=="refine";
  $("#planTitle").textContent = T("plan");
  $("#shopTitle").textContent = T("shop");
  if(!plan.length){ $("#plan").innerHTML=`<div class="empty">${T("planEmpty")}</div>`; $("#shop").innerHTML=`<div class="empty">${T("shopEmpty")}</div>`; shopText=""; return; }
  let tCost=0, tRev=0, tStation=0, ok=true; const shop={};
  const rows = plan.map((p,i)=>{
    const c=calc(p.id,p.qty,!!p.chain), city=p.sellCity||"Brecilien", sp=sellPrice(p.id,city), rev=c.made*sp*(1-feeRate()), spent=c.cost+c.buyFee+c.station-c.back, pr=rev-spent;
    tCost+=c.cost+c.buyFee-c.back; tStation+=c.station; tRev+=rev; if(!sp||c.missing) ok=false;
    for(const l of c.lines){ const e=((shop[l.city] ||= {})[l.iid] ||= {need:0,sum:0,p:l.p}); e.need+=l.need; e.sum+=l.sum*(1+buyFeeRate()); }
    return `<tr>
      <td><div class="ing">${img(p.id)}<div class="nm">${esc(nm(p.id))} ${badge(p.id)}${p.chain?`<div class="alt">${T("chainShort")}</div>`:""}</div></div></td>
      <td class="n"><input type="number" class="pq" min="1" data-pq="${i}" value="${p.qty}" aria-label="${T("count")}"></td>
      <td class="n">${fmt(c.made)}</td>
      <td><select data-pc="${i}" aria-label="${T("sellIn")}">${CITIES.map(cc=>`<option value="${cc}" ${cc===city?"selected":""}>${cc}</option>`).join("")}</select></td>
      <td class="n">${sp?fmt(sp):"—"}</td>
      <td class="n">${sp?fmt(rev):"—"}</td>
      <td class="n">${fmt(spent)}</td>
      <td class="n ${sp&&!c.missing?(pr>=0?"pos":"neg"):""}">${sp&&!c.missing?(pr>=0?"+":"")+fmt(pr):"—"}</td>
      <td class="n"><button class="x" data-del="${i}" aria-label="${T("remove")}">×</button></td></tr>`;
  }).join("");
  const items = `<div class="tbl plan-tbl"><table><thead><tr><th>${T("item")}</th><th class="n">${T("planQty")}</th><th class="n">${T("toSell")}</th><th>${T("sellIn")}</th><th class="n">${T("unit")}</th><th class="n">${T("revenue")}</th><th class="n">${T("spent")}</th><th class="n">${T("profit")}</th><th></th></tr></thead><tbody>${rows}</tbody>
    <tfoot><tr><td>${T("txtTotal")}</td><td></td><td></td><td></td><td></td><td class="n">${fmt(tRev)}</td><td class="n">${fmt(tCost+tStation)}</td><td class="n ${ok?(tRev-tCost-tStation>=0?"pos":"neg"):""}">${ok?((tRev-tCost-tStation)>=0?"+":"")+fmt(tRev-tCost-tStation):"—"}</td><td></td></tr></tfoot></table></div>`;
  // Items marked "already have" are not bought, but profit still counts them at market price: you could sell them instead.
  let toBuy=0, haveSum=0;
  for(const c of Object.keys(shop)) for(const [iid,e] of Object.entries(shop[c])){ if(st.have[iid]) haveSum+=e.sum; else toBuy+=e.sum; }
  const pr=tRev-tCost-tStation;
  $("#plan").innerHTML = `${items}<div class="plan-sum">

function setStatus(msg, err){ const s=$("#status"); s.hidden=!msg; s.textContent=msg||""; s.classList.toggle("err",!!err); }
function ago(ts){ const m=Math.round((Date.now()-new Date(ts))/60000); return m<1?T("justNow"):m<60?m+T("minAgo"):Math.round(m/60)+T("hAgo"); }
function renderInfo(){

$("#auto").addEventListener("change", e=>{ st.auto=+e.target.value; save(); scheduleAuto(); });

function textOf(res){ if(typeof res?.payload==="string") return res.payload; const b=(res?.content||[]).find(x=>x.type==="text"); return b?b.text:(res?.payload!=null?JSON.stringify(res.payload):""); }
function mcpMsg(e){
  switch(e?.code){
    case "server_not_connected": return T("onlyApp");
    case "not_in_manifest": case "approval_required": return T("notAllowed");
    case "cancelled": return T("cancelled");
    case "tool_error": return T("browserFail")+(e.message||"").slice(0,160);
    case "parse": return T("badFormat");
    default: return T("genericFail");
  }
}
async function fetchLocal(){
  const r=await fetch("/api/prices?server="+encodeURIComponent(st.server)); const j=await r.json();
  if(!r.ok) throw {local:true, message:j.error||("HTTP "+r.status)}; return j;
}
async function fetchViaClaude(){
  const mcp=await claude.use("mcp"); if(!mcp) throw {code:"server_not_connected"};
  const ids=[...MAIN_IDS, ...gearWant()], prices={};
  for(let i=0;i<ids.length;i+=110){
    const url=`https://${st.server}.albion-online-data.com/api/v2/stats/prices/${ids.slice(i,i+110).join(",")}.json?locations=${encodeURIComponent(CITIES.join(","))}&qualities=1`;
    const r1=await mcp.callTool("host:claude_browser","preview_start",{url},{cache:false});
    const m=/tabId\s+([^\s\)]+)/.exec(textOf(r1));
    const r2=await mcp.callTool("host:claude_browser","get_page_text", m?{tabId:m[1],max_chars:900000}:{max_chars:900000},{cache:false});
    const t2=textOf(r2), a=t2.indexOf("["), b=t2.lastIndexOf("]"); if(a<0||b<a) throw {code:"parse"};
    for(const x of JSON.parse(t2.slice(a,b+1))){
      const e=(prices[x.item_id] ||= {})[x.city]={s:(x.sell_price_min>0&&x.sell_price_min<5e7)?x.sell_price_min:0, b:(x.buy_price_max>0&&x.buy_price_max<5e7)?x.buy_price_max:0};
      const old=DATA.prices[x.item_id]?.[x.city]; if(old&&st.server==="europe"){ if(old.v!=null) e.v=old.v; if(old.a) e.a=old.a; }
    }
  }
  return {at:new Date().toISOString(), prices};
}
// Equipment prices: the desktop app asks its server for the opened item, its ingredients and the gear plan.
const EXTRA={}, extraAt={}; let extraBusy=false, extraAgain=false;
function gearWant(){
  const ids=new Set(), add=id=>{ if(!DATA.recipes[id]) return; for(const i of [id, ...Object.keys(DATA.recipes[id].ing)]) if(!MAIN_IDS.has(i)) ids.add(i); };
  if(st.tab==="gear"){ gNorm(); for(let e=0;e<=4;e++) add(gearId(st.gear.base, st.gear.tier, e)); }
  for(const p of st.plans.gear||[]) add(p.id);
  return [...ids];
}
async function ensureExtra(force){
  if(!LOCAL) return;
  const ids=gearWant().filter(i=>force || !extraAt[i] || Date.now()-extraAt[i]>10*60000);
  if(!ids.length) return;
  if(extraBusy){ extraAgain=true; return; }
  extraBusy=true;
  try{
    for(let i=0;i<ids.length;i+=100){
      const part=ids.slice(i,i+100);
      const r=await fetch(`/api/prices/extra?server=${encodeURIComponent(st.server)}&ids=${part.map(encodeURIComponent).join(",")}`);
      const j=await r.json(); if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
      for(const id of part){ extraAt[id]=Date.now(); if(j.prices?.[id]) EXTRA[id]=PRICES[id]=j.prices[id]; }
    }
    renderMain(); renderPlan();
  }catch(e){ setStatus(T("loadFail")+e.message+T("loadFail2"), true); }
  finally{ extraBusy=false; if(extraAgain){ extraAgain=false; ensureExtra(); } }
}
let busy=false;
async function refreshPrices(){
  if(busy) return; busy=true; const btn=$("#refresh"); btn.disabled=true;
  setStatus(LOCAL?T("loading"):T("loadingClaude"));
  try{
    const j = LOCAL ? await fetchLocal() : await fetchViaClaude();
    PRICES=Object.assign(j.prices, LOCAL?EXTRA:{}); pricesLive=true; pricesAt=j.at; setStatus(j.warning||"");
    renderInfo(); renderMain(); renderPlan(); ensureExtra(true);
  }catch(e){ setStatus(e?.local ? T("loadFail")+e.message+T("loadFail2") : mcpMsg(e), true); }
  finally{ btn.disabled=false; busy=false; }
}
$("#refresh").addEventListener("click", refreshPrices);
let autoTimer=null;
function scheduleAuto(){ clearInterval(autoTimer); if(LOCAL&&st.auto>0) autoTimer=setInterval(refreshPrices, st.auto*60000); }
setInterval(()=>{ if(pricesLive) renderInfo(); }, 30000);

  $("#tourNext").textContent= tourI===TOUR.length-1 ? T("tourDone") : T("tourNext");

  if(!el){ spot.className="tour-spot center"; spot.style.cssText=""; card.style.left=((vw-cw)/2)+"px"; card.style.top=Math.max(16,(vh-ch)/2)+"px"; return; }
  const r=el.getBoundingClientRect(), pad=6;

function updShow(pct, text){
  $("#updProg").hidden=false; $("#updBarFill").style.width=Math.max(0,Math.min(100,pct))+"%"; $("#updPct").textContent=text;
}
$("#updGo").addEventListener("click", async ()=>{
  const go=$("#updGo"), later=$("#updLater"); go.disabled=true; later.disabled=true; setStatus("");
  const failed=msg=>{ setStatus(T("updFail")+msg, true); go.disabled=false; later.disabled=false; $("#updProg").hidden=true; };
  try{
    const r=await fetch("/api/update/install",{method:"POST"}); const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.error||("HTTP "+r.status));
  }catch(e){ failed(e.message); return; }
  updShow(0, T("updLoading")+" 0%");
  const timer=setInterval(async ()=>{
    let p; try{ p=await (await fetch("/api/update/progress",{cache:"no-store"})).json(); }catch(e){ clearInterval(timer); return; } // app is closing
    if(p.state==="downloading"){ const pct=p.total?Math.floor(p.done*100/p.total):0; updShow(pct, T("updLoading")+" "+pct+"%"); }
    else if(p.state==="installing"){ updShow(100, "100%"); setStatus(T("updRestart")); }
    else if(p.state==="error"){ clearInterval(timer); failed(p.error||""); }
  }, 250);
});

$("#closeSettings").addEventListener("click", ()=>$("#settingsDlg").close());
$("#settingsDlg").addEventListener("click", e=>{ if(e.target.id==="settingsDlg") $("#settingsDlg").close(); });
$("#themeSeg").addEventListener("click", e=>{ const b=e.target.closest("[data-theme-set]"); if(!b) return; st.theme=b.dataset.themeSet; save(); applyStatic(); });
$("#checkNow").addEventListener("click", async ()=>{
  const s=$("#updState"); s.textContent=T("updChecking");
  try{ const r=await fetch("/api/update/check?fresh=1"); const j=await r.json(); if(!r.ok) throw new Error(j.error||r.status);
    updInfo=j; updHidden=false; renderUpdate(); s.textContent = j.newer ? T("updFound")+j.latest : T("updLatest")+" ("+j.current+")";
  }catch(e){ s.textContent=T("updErr")+e.message; }
});
$("#resetAsk").addEventListener("click", ()=>{ $("#resetAsk").hidden=true; $("#resetConfirm").hidden=false; });
$("#resetNo").addEventListener("click", ()=>{ $("#resetConfirm").hidden=true; $("#resetAsk").hidden=false; });
$("#resetYes").addEventListener("click", async ()=>{
  const keep={lang:st.lang, theme:st.theme, tourDone:true};
  try{ localStorage.removeItem("kotel_state"); }catch(e){}
  for(const k of Object.keys(st)) delete st[k];
  Object.assign(st, structuredClone(DEFAULTS), keep);
  st.plans={potion:[],refine:[],gear:[]};
  ls.set("kotel_state", st);
  if(LOCAL){ try{ await fetch("/api/state",{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(st)}); }catch(e){} }
  $("#settingsDlg").close(); renderAll();
});
$("#ghLink").addEventListener("click", e=>{ if(LOCAL){ e.preventDefault(); fetch("/api/open-github",{method:"POST"}).catch(()=>{}); } });

async function boot(){
  loadState(ls.get("kotel_state"));
  if(LOCAL){
    try{ const r=await fetch("/api/state"); if(r.ok){ const s=await r.json(); if(s && Object.keys(s).length) loadState(s); } }catch(e){}
    const ping=()=>fetch("/api/ping",{cache:"no-store"}).catch(()=>{});
    ping(); setInterval(ping, 5000);
    window.addEventListener("pagehide", ()=>{ try{ navigator.sendBeacon("/api/bye"); }catch(e){} });
  }
  renderAll(); renderUpdate();
  const updatedTo = new URLSearchParams(location.search).get("updated");
  if(updatedTo){ setStatus(T("updDone")+updatedTo); try{ history.replaceState(null,"",location.pathname); }catch(e){} setTimeout(()=>{ if($("#status").textContent.startsWith(T("updDone"))) setStatus(""); }, 8000); }
  if(LOCAL){ scheduleAuto(); refreshPrices().then(()=>ensureExtra()); setTimeout(checkForUpdate, 3000); setInterval(checkForUpdate, 6*3600*1000); }
  if(!st.tourDone) setTimeout(tourStart, 500);
}
boot();
</script>
